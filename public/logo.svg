<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" width="100%" height="100%">
  <defs>
    <linearGradient id="vrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Left Shield Icon (60x60) -->
  <g transform="translate(5, 5)">
    <!-- Background Shield/Rounded Box -->
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#vrGrad)" />
    <!-- Inner Frame / Window structure -->
    <rect x="8" y="8" width="44" height="44" rx="8" fill="#020617" stroke="#ffffff" stroke-width="2.5" opacity="0.95" />
    <!-- Window Glass Panes -->
    <rect x="12" y="12" width="17" height="17" rx="3" fill="url(#glassGrad)" stroke="#34d399" stroke-width="1" />
    <rect x="31" y="12" width="17" height="17" rx="3" fill="url(#glassGrad)" stroke="#34d399" stroke-width="1" />
    <rect x="12" y="31" width="17" height="17" rx="3" fill="url(#glassGrad)" stroke="#34d399" stroke-width="1" />
    <rect x="31" y="31" width="17" height="17" rx="3" fill="url(#glassGrad)" stroke="#34d399" stroke-width="1" />
    <!-- VR Monogram Badge -->
    <path d="M 18 22 L 25 38 L 29 29" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 31 22 L 38 22 C 41 22, 41 29, 38 29 L 31 29 M 36 29 L 41 38" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Text: VICRENOVATION -->
  <text x="78" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="28" letter-spacing="-0.5">
    <tspan fill="#ffffff">VIC</tspan><tspan fill="#10b981">RENOVATION</tspan>
  </text>
  
  <!-- Subtitle Tagline -->
  <text x="79" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="9" fill="#94a3b8" letter-spacing="1.5">
    RAMEN • DEUREN • INTERIEUR
  </text>
</svg>
